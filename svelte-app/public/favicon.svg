<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#0f172a" /> <!-- Dark background -->
  
  <!-- Light beam entering -->
  <line x1="10" y1="70" x2="40" y2="55" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9" stroke-linecap="round"/>
  
  <!-- Refracted beams -->
  <line x1="60" y1="50" x2="95" y2="25" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="50" x2="95" y2="38" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="50" x2="95" y2="51" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="50" x2="95" y2="64" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="50" x2="95" y2="77" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>

  <!-- Prism Triangle -->
  <polygon points="50,25 25,75 75,75" fill="url(#prismGrad)" stroke="#e2e8f0" stroke-width="2"/>
  
  <defs>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
</svg>