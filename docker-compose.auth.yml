version: '3.8'

services:
  auth_db:
    image: postgres:15-alpine
    container_name: spectra_auth_db
    environment:
      POSTGRES_USER: auth_admin
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_db
    ports:
      - "8124:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  auth_pgdata:
